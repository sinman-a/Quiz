<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project Management Quiz — PMBOK 7th Edition" />
  <title>PM Quiz</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/animations.css" />
</head>
<body>

  <!-- Стартовий екран -->
  <div id="screen-start" class="screen active">
    <div class="card glass center">
      <div class="logo-icon">📋</div>
      <h1 class="title" data-i18n="title">Project Management Quiz</h1>
      <p class="subtitle" data-i18n="subtitle">PMBOK® 7th Edition</p>
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="uk">🇺🇦 Українська</button>
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
      </div>
      <button class="btn btn-primary" id="btn-start" data-i18n="start">Почати квест</button>
    </div>
  </div>

  <!-- Екран квізу -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-container">
      <header class="quiz-header">
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="progress-text" id="progress-text">1 / 20</span>
        </div>
        <div class="score-badge">
          <span data-i18n="score">Рахунок</span>:&nbsp;<span id="score-display">0</span>
        </div>
      </header>

      <main class="question-wrap" id="question-wrap">
        <div class="category-tag" id="category-tag"></div>
        <p class="question-text" id="question-text"></p>
        <ul class="options-list" id="options-list" role="list"></ul>
        <div class="explanation-box hidden" id="explanation-box">
          <p id="explanation-text"></p>
        </div>
        <button class="btn btn-primary hidden" id="btn-next" data-i18n="next">Наступне питання</button>
      </main>
    </div>
  </div>

  <!-- Екран результатів -->
  <div id="screen-result" class="screen">
    <div class="card glass center result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h2 class="result-title" data-i18n="yourScore">Ваш результат</h2>
      <div class="result-score">
        <span id="final-score">0</span><span class="result-total">/20</span>
      </div>
      <p class="result-msg" id="result-msg"></p>
      <button class="btn btn-primary" id="btn-restart" data-i18n="restart">Почати знову</button>
    </div>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
